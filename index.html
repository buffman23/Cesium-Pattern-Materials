<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cesium Pattern Materials</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="toolbar">
      <div id="solutionDescription"></div>
      <button id="btnPolyline">Draw Polyline</button>
      <button id="btnPolygon">Draw Polygon</button>
      <button id="btnClear">Clear</button>
      <label for="lineWidth" class="slider-label">
        Line width <span id="lineWidthValue"></span>
      </label>
      <input id="lineWidth" type="range" min="2" max="96" step="1" />
      <label for="stampSpacing" class="slider-label">
        Stamp spacing <span id="stampSpacingValue"></span>
      </label>
      <!-- Logarithmic: value v gives a 2^v multiplier, so 0.25x..4x with 1x in the middle. -->
      <input id="stampSpacing" type="range" min="-2" max="2" step="0.01" />
      <label for="maxHeightUpper" class="slider-label">
        Max height <span id="maxHeightValue"></span>
      </label>
      <!-- Per shape, in multiples of the camera height at which the shape's bounding box fills
           the view. Two handles on one logarithmic track: value v gives 2^v (0.125x..19x).
           Lower = where the transition starts, upper = max height; the far right end = off. -->
      <div id="maxHeight" class="dual-range">
        <input id="maxHeightLower" type="range" min="-3" max="4.25" step="0.01"
               aria-label="Transition start" />
        <input id="maxHeightUpper" type="range" min="-3" max="4.25" step="0.01"
               aria-label="Max height" />
      </div>
      <div class="row">
        <div>
          <label for="lineImage">Line image</label>
          <select id="lineImage">
            <option value="">None</option>
            <option value="solid" selected>Solid</option>
            <option value="dashed">Dashed</option>
            <option value="wave">Wave</option>
            <option value="sawtooth">Sawtooth</option>
            <option value="bottom">Bottom</option>
          </select>
        </div>
        <div>
          <label for="stampImage">Stamp image</label>
          <select id="stampImage">
            <option value="">None</option>
            <option value="x" selected>X</option>
            <option value="arrow">Arrow</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="polygonImage">Polygon fill</label>
          <select id="polygonImage">
            <option value="hatch" selected>Hatch</option>
            <option value="dots">Dots</option>
            <option value="checkers">Checkers</option>
          </select>
        </div>
      </div>
      <div id="hint">Pick a tool to start drawing.</div>
      <div id="cameraHeight"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
