<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Seamless 45-degree hatch tile. The main diagonal plus the two half-diagonals in the opposite
       corners line up exactly across tile edges, so repeated tiles form long continuous lines.
       Lines are extended past the tile bounds so the caps never show at the corners. -->
  <g stroke="#ffffff" stroke-width="24" fill="none">
    <line x1="-32" y1="288" x2="288" y2="-32" />
    <line x1="-160" y1="160" x2="160" y2="-160" />
    <line x1="96" y1="416" x2="416" y2="96" />
  </g>
</svg>
