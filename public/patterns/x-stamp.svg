<svg xmlns="http://www.w3.org/2000/svg" width="256" height="128" viewBox="0 0 256 128">
  <!-- One stamp tile: a line segment spanning the full tile width with an "X" centered on it.
       Repeating the tile along a polyline yields a continuous line with evenly spaced X's.
       The X is 56 wide x 104 tall so it reads as a tall letter "X". White so the material color can tint it. -->
  <g stroke="#ffffff" fill="none">
    <line x1="0" y1="64" x2="256" y2="64" stroke-width="12" />
    <g stroke-width="14" stroke-linecap="round">
      <line x1="100" y1="12" x2="156" y2="116" />
      <line x1="156" y1="12" x2="100" y2="116" />
    </g>
  </g>
</svg>
